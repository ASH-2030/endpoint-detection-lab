title: Purple Team Scheduled Task Creation
id: 4a72e91c-6f35-4c18-b8d1-91f3e52a7a40
status: test
description: Detects the controlled scheduled-task creation used during Week 4 purple-team validation.
author: Alishba Jaffri
date: 2026-10-05
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
      - '/Create'
      - 'PurpleTeam-Test-Task'
  condition: selection
falsepositives:
  - Authorized administrative task creation
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
